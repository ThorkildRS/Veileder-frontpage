<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolleveileder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #06071b;
    --ink-soft: #2a2b3d;
    --ink-muted: #6b6c7a;
    --paper: #faf8f3;
    --card: #ffffff;
    --line: #e8e5dc;
    --line-strong: #c9c5b5;
    --accent: #3278f2;
    --accent-soft: #e8f0fd;
    --success: #2a5d3a;

  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    font-family: 'DM Sans', -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    font-feature-settings: 'ss01', 'ss02';
    pointer-events: none;
    height: 100%;
    overflow: hidden;
  }

  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6,7,27,0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
    pointer-events: none;
  }
  .modal-backdrop.active {
    display: flex;
    pointer-events: auto;
    animation: fadeBackdrop 0.25s ease;
  }
  @keyframes fadeBackdrop {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: var(--card);
    border-radius: 20px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: slideUp 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal::before, .modal::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    border: 1.5px solid var(--line-strong);
    pointer-events: none;
  }
  .modal::before { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
  .modal::after { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }

  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--line);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    transition: all 0.15s;
    font-family: inherit;
    z-index: 10;
  }
  .modal-close:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

  .modal-inner { padding: 36px 36px 28px; }

  .modal-head { margin-bottom: 24px; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 10.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 16px;
  }
  .eyebrow-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; }

  h2.q-title {
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  h2.q-title em { font-style: italic; font-weight: 500; }
  .q-subtitle { color: var(--ink-muted); font-size: 14.5px; line-height: 1.5; }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 16px;
    margin-bottom: 20px;
    border-bottom: 1px dashed var(--line);
    font-size: 12px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .progress-bars { display: flex; gap: 4px; }
  .progress-bars span {
    width: 24px; height: 3px;
    background: var(--line);
    border-radius: 2px;
    transition: background 0.3s ease;
  }
  .progress-bars span.active { background: var(--ink); }
  .progress-bars span.done { background: var(--accent); }
  .progress-meta { display: flex; align-items: center; gap: 8px; }
  .time-remaining::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--success);
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }

  .options { display: flex; flex-direction: column; gap: 6px; }
  .option {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    width: 100%;
    position: relative;
  }
  .option:hover { background: #fff; border-color: var(--ink); transform: translateX(2px); }
  .option:hover .option-arrow { opacity: 1; transform: translateX(2px); }
  .option-icon {
    width: 32px; height: 32px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .option:hover .option-icon { border-color: var(--ink); }
  .option-icon svg {
    width: 16px; height: 16px;
    stroke: var(--ink);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .option-text { flex: 1; min-width: 0; }
  .option-label { font-weight: 500; font-size: 15px; letter-spacing: -0.005em; line-height: 1.3; }
  .option-desc { font-size: 12.5px; color: var(--ink-muted); line-height: 1.4; margin-top: 2px; }
  .option-arrow { color: var(--ink-muted); font-size: 16px; opacity: 0.3; transition: all 0.15s; flex-shrink: 0; }

  .options-exp { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .options-exp .option { flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px 14px; min-height: 120px; }
  .options-exp .option-arrow { display: none; }

  .modal-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .back-link {
    background: none; border: 0;
    color: var(--ink-muted);
    font-family: inherit; font-size: 13px;
    cursor: pointer; padding: 6px 0;
    display: flex; align-items: center; gap: 4px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--ink); }
  .back-link:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

  /* Result */
  .result .eyebrow { color: var(--success); }
  .result .eyebrow-dot { background: var(--success); }
  .result h2 { font-weight: 600; font-size: 26px; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 10px; }
  .result h2 em { font-style: italic; font-weight: 500; color: var(--accent); }
  .result-intro-text { color: var(--ink-soft); font-size: 14.5px; line-height: 1.55; margin-bottom: 24px; }

  .resources { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .resource {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 14px;
    align-items: center;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    color: inherit;
  }
  .resource:hover { background: #fff; border-color: var(--ink); transform: translateX(2px); }
  .resource-num { font-size: 26px; font-weight: 500; color: var(--accent); line-height: 1; font-variant-numeric: lining-nums tabular-nums; letter-spacing: -0.02em; }
  .resource-body { min-width: 0; }
  .resource-type { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; margin-bottom: 3px; }
  .resource-title { font-weight: 500; font-size: 14.5px; letter-spacing: -0.005em; line-height: 1.3; margin-bottom: 2px; }
  .resource-meta { font-size: 12.5px; color: var(--ink-muted); }
  .resource-arrow { color: var(--ink-muted); font-size: 16px; }

  .cta-card {
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    padding: 20px;
    border: 1.5px solid var(--ink);
    margin-bottom: 16px;
  }
  .cta-label { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
  .cta-card h3 { font-weight: 600; font-size: 19px; letter-spacing: -0.015em; line-height: 1.2; margin-bottom: 8px; }
  .cta-card p { color: var(--ink-soft); font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
  .cta-buttons { display: flex; gap: 8px; }
  .btn-primary {
    flex: 1; background: var(--accent); color: #fff;
    padding: 11px 14px; border-radius: 30px; border: 0;
    font-family: inherit; font-weight: 500; font-size: 13.5px;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary:hover { background: #1e5fd1; }
  .btn-secondary {
    background: transparent; color: var(--ink);
    padding: 11px 14px; border-radius: 30px;
    border: 1px solid var(--line-strong);
    font-family: inherit; font-weight: 500; font-size: 13.5px;
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-secondary:hover { border-color: var(--ink); }

  .result-foot {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; color: var(--ink-muted);
    padding-top: 14px; border-top: 1px dashed var(--line);
  }
  .result-foot a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }

  .step { animation: stepIn 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes stepIn {
    from { opacity: 0; transform: translateX(8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @media (max-width: 600px) {
    .modal-inner { padding: 28px 22px 22px; }
    h2.q-title { font-size: 24px; }
    .options-exp { grid-template-columns: 1fr; }
    .options-exp .option { min-height: auto; flex-direction: row; }
  }
</style>
</head>

  function render() {
    const el = document.getElementById('modal-content');
    if (state.step === 0) {
      el.innerHTML = renderQuestion({ num: '01/03', eyebrow: 'Finn din vei', title: '<em>Hvem</em> er du?', subtitle: 'Tre korte spørsmål. Vi peker deg til det som faktisk er relevant.', options: roles, variant: 'list', onSelect: 'selectRole' });
    } else if (state.step === 1) {
      el.innerHTML = renderQuestion({ num: '02/03', eyebrow: 'Nesten der', title: 'Hvor godt kjenner du <em>åpenBIM</em>?', subtitle: 'Ærlig svar gir bedre anbefaling.', options: experience, variant: 'exp', onSelect: 'selectExperience' });
    } else if (state.step === 2) {
      el.innerHTML = renderQuestion({ num: '03/03', eyebrow: 'Siste spørsmål', title: 'Hva er <em>mest aktuelt</em> nå?', subtitle: 'Det som står øverst på listen din.', options: contexts[state.role], variant: 'list', onSelect: 'selectContext' });
    } else if (state.step === 3) {
      el.innerHTML = renderResult();
    }
  }

  function renderQuestion({ num, eyebrow, title, subtitle, options, variant, onSelect }) {
    const bars = [0, 1, 2].map(i => {
      let cls = '';
      if (i < state.step) cls = 'done';
      else if (i === state.step) cls = 'active';
      return `<span class="${cls}"></span>`;
    }).join('');
    const timeLeft = [20, 15, 10][state.step] || 10;
    const optsHtml = options.map(opt => {
      if (variant === 'exp') {
        return `<button class="option" onclick="${onSelect}('${opt.id}')"><div class="option-icon">${opt.icon}</div><div class="option-text"><div class="option-label">${opt.label}</div>${opt.desc ? `<div class="option-desc">${opt.desc}</div>` : ''}</div></button>`;
      }
      return `<button class="option" onclick="${onSelect}('${opt.id}')"><div class="option-icon">${opt.icon}</div><div class="option-text"><div class="option-label">${opt.label}</div>${opt.desc ? `<div class="option-desc">${opt.desc}</div>` : ''}</div><div class="option-arrow">→</div></button>`;
    }).join('');
    return `<div class="step"><div class="modal-head"><div class="eyebrow"><span class="eyebrow-dot"></span>${eyebrow}</div><h2 class="q-title">${title}</h2><p class="q-subtitle">${subtitle}</p></div><div class="progress-row"><div class="progress-bars">${bars}</div><div class="progress-meta"><span>${num}</span><span>·</span><span class="time-remaining">~${timeLeft} sek</span></div></div><div class="options ${variant === 'exp' ? 'options-exp' : ''}">${optsHtml}</div><div class="modal-foot"><button class="back-link" onclick="goBack()" ${state.step === 0 ? 'disabled' : ''}>← Tilbake</button><span>Ingen epost. Ingen innlogging.</span></div></div>`;
  }

  function renderResult() {
    const key = `${state.role}-${state.context}`;
    const r = results[key];
    const resHtml = r.resources.map((res, i) => `<a class="resource" href="#"><div class="resource-num">0${i + 1}</div><div class="resource-body"><div class="resource-type">${res.type}</div><div class="resource-title">${res.title}</div><div class="resource-meta">${res.meta}</div></div><div class="resource-arrow">→</div></a>`).join('');
    return `<div class="step result"><div class="modal-head"><div class="eyebrow"><span class="eyebrow-dot"></span>Din vei inn</div><h2>${r.headline}</h2><p class="result-intro-text">${r.intro}</p></div><div class="resources">${resHtml}</div><div class="cta-card"><div class="cta-label">For deg som ikke er medlem</div><h3>${r.ctaHeading}</h3><p>${r.ctaBody}</p><div class="cta-buttons"><button class="btn-primary">Bli medlem →</button><button class="btn-secondary">Book prat →</button></div></div><div class="result-foot"><button class="back-link" onclick="restart()">↺ Start på nytt</button><span>Få ressursene på <a href="#">e-post</a></span></div></div>`;
  }

  function notifyParent(msg) {
    try { window.parent.postMessage(msg, '*'); } catch(e) {}
    try { window.top.postMessage(msg, '*'); } catch(e) {}
  }

  function openModal() {
    document.getElementById('backdrop').classList.add('active');
    notifyParent('rolleveileder_opened');
    state.step = 0; state.role = null; state.experience = null; state.context = null;
    render();
  }
  function closeModal() {
    document.getElementById('backdrop').classList.remove('active');
    notifyParent('rolleveileder_closed');
  }
  function handleBackdropClick(e) {
    if (e.target.id === 'backdrop') closeModal();
  }
  function selectRole(id) { state.role = id; state.step = 1; render(); }
  function selectExperience(id) { state.experience = id; state.step = 2; render(); }
  function selectContext(id) { state.context = id; state.step = 3; render(); }
  function goBack() { if (state.step > 0) { state.step--; render(); } }
  function restart() { state.step = 0; state.role = null; state.experience = null; state.context = null; render(); }

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // Triggered by button on the Framer page via postMessage
  window.addEventListener('message', (e) => {
    if (e.data === 'openRolleveileder') openModal();
  });
</script>
