<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>buildingSMART Norge — Rolleveileder MVP v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #06071b;
    --ink-soft: #2a2b3d;
    --ink-muted: #6b6c7a;
    --paper: #faf8f3;
    --card: #ffffff;
    --line: #e8e5dc;
    --line-strong: #c9c5b5;
    --accent: #3278f2;
    --accent-soft: #e8f0fd;
    --success: #2a5d3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #e8e5dc;
    font-family: 'DM Sans', -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    font-feature-settings: 'ss01', 'ss02';
  }

  /* ---------- Page frame ---------- */
  .page-wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }

  .browser-chrome {
    background: #fff;
    border-radius: 12px 12px 0 0;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--line);
  }
  .browser-dots { display: flex; gap: 6px; }
  .browser-dots span {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--line);
  }
  .browser-url {
    flex: 1;
    background: var(--paper);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    color: var(--ink-muted);
  }

  .site-frame {
    background: var(--paper);
    border-radius: 0 0 12px 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(6,7,27,0.08);
    min-height: 680px;
    position: relative;
  }

  /* Faux nav */
  .fake-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 40px;
    border-bottom: 1px solid var(--line);
  }
  .fake-logo {
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.02em;
  }
  .fake-logo-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    margin-left: 3px;
    vertical-align: middle;
    transform: translateY(-6px);
  }
  .fake-nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--ink-soft); }
  .fake-nav-cta {
    background: var(--ink); color: #fff;
    padding: 10px 20px; border-radius: 40px;
    font-size: 14px; font-weight: 500;
  }

  /* Hero */
  .hero {
    padding: 96px 40px 80px;
    text-align: center;
    position: relative;
  }
  .hero h1 {
    font-size: 56px;
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.02;
    margin-bottom: 18px;
    max-width: 820px;
    margin-left: auto;
    margin-right: auto;
  }
  .hero h1 em {
    font-style: italic;
    font-weight: 500;
  }
  .hero p {
    color: var(--ink-muted);
    font-size: 16px;
    max-width: 560px;
    margin: 0 auto 40px;
    line-height: 1.55;
  }

  /* ============ THE CTA ON HOMEPAGE ============ */
  .onboarding-cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 8px 8px 8px 20px;
    font-size: 14px;
    color: var(--ink-soft);
    box-shadow: 0 2px 12px rgba(6,7,27,0.04);
    transition: all 0.2s ease;
    cursor: pointer;
    font-family: inherit;
  }
  .onboarding-cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(6,7,27,0.08);
    border-color: var(--ink);
  }
  .onboarding-cta-label {
    font-weight: 400;
  }
  .onboarding-cta-label strong {
    font-weight: 600;
    color: var(--ink);
  }
  .onboarding-cta-badge {
    background: var(--ink);
    color: #faf8f3;
    padding: 8px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .onboarding-cta:hover .onboarding-cta-badge {
    background: var(--accent);
  }
  .onboarding-cta-badge-time {
    font-size: 11px;
    opacity: 0.7;
    letter-spacing: 0.04em;
  }

  /* Pulse dot */
  .pulse-dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    position: relative;
  }
  .pulse-dot::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    animation: pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6,7,27,0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .modal-backdrop.active {
    display: flex;
    animation: fadeBackdrop 0.25s ease;
  }
  @keyframes fadeBackdrop {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: var(--card);
    border-radius: 20px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    animation: slideUp 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Corner marks — subtle architectural touch */
  .modal::before, .modal::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    border: 1.5px solid var(--line-strong);
    pointer-events: none;
  }
  .modal::before { top: 12px; left: 12px; border-right: 0; border-bottom: 0; }
  .modal::after { bottom: 12px; right: 12px; border-left: 0; border-top: 0; }

  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--line);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    transition: all 0.15s;
    font-family: inherit;
    z-index: 10;
  }
  .modal-close:hover {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .modal-inner { padding: 36px 36px 28px; }

  /* Header block */
  .modal-head {
    margin-bottom: 24px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 10.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 16px;
  }
  .eyebrow-dot {
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
  }

  h2.q-title {
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.025em;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  h2.q-title em {
    font-style: italic;
    font-weight: 500;
  }
  .q-subtitle {
    color: var(--ink-muted);
    font-size: 14.5px;
    line-height: 1.5;
  }

  /* Progress row */
  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 16px;
    margin-bottom: 20px;
    border-bottom: 1px dashed var(--line);
    font-size: 12px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .progress-bars {
    display: flex;
    gap: 4px;
  }
  .progress-bars span {
    width: 24px; height: 3px;
    background: var(--line);
    border-radius: 2px;
    transition: background 0.3s ease;
  }
  .progress-bars span.active { background: var(--ink); }
  .progress-bars span.done { background: var(--accent); }

  .progress-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .time-remaining::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--success);
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }

  /* Options — compact list style */
  .options { display: flex; flex-direction: column; gap: 6px; }

  .option {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    width: 100%;
    position: relative;
  }
  .option:hover {
    background: #fff;
    border-color: var(--ink);
    transform: translateX(2px);
  }
  .option:hover .option-arrow {
    opacity: 1;
    transform: translateX(2px);
  }
  .option-icon {
    width: 32px; height: 32px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .option:hover .option-icon {
    border-color: var(--ink);
  }
  .option-icon svg {
    width: 16px; height: 16px;
    stroke: var(--ink);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .option-text {
    flex: 1;
    min-width: 0;
  }
  .option-label {
    font-weight: 500;
    font-size: 15px;
    letter-spacing: -0.005em;
    line-height: 1.3;
  }
  .option-desc {
    font-size: 12.5px;
    color: var(--ink-muted);
    line-height: 1.4;
    margin-top: 2px;
  }
  .option-arrow {
    color: var(--ink-muted);
    font-size: 16px;
    opacity: 0.3;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  /* Experience step — horizontal layout since only 3 options */
  .options-exp {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .options-exp .option {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 16px 14px;
    min-height: 120px;
  }
  .options-exp .option-arrow { display: none; }

  /* Footer */
  .modal-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--ink-muted);
  }
  .back-link {
    background: none;
    border: 0;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--ink); }
  .back-link:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

  /* ---------- RESULT ---------- */
  .result { }
  .result .eyebrow { color: var(--success); }
  .result .eyebrow-dot { background: var(--success); }

  .result h2 {
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .result h2 em {
    font-style: italic;
    font-weight: 500;
    color: var(--accent);
  }
  .result-intro-text {
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.55;
    margin-bottom: 24px;
  }

  .resources {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 24px;
  }
  .resource {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 14px;
    align-items: center;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    color: inherit;
  }
  .resource:hover {
    background: #fff;
    border-color: var(--ink);
    transform: translateX(2px);
  }
  .resource-num {
    font-size: 26px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
    font-variant-numeric: lining-nums tabular-nums;
    letter-spacing: -0.02em;
  }
  .resource-body { min-width: 0; }
  .resource-type {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .resource-title {
    font-weight: 500;
    font-size: 14.5px;
    letter-spacing: -0.005em;
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .resource-meta {
    font-size: 12.5px;
    color: var(--ink-muted);
  }
  .resource-arrow {
    color: var(--ink-muted);
    font-size: 16px;
  }

  /* CTA card for membership — compact */
  .cta-card {
    background: var(--ink);
    color: #faf8f3;
    border-radius: 14px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .cta-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 100% 0%, rgba(50,120,242,0.28), transparent 55%);
    pointer-events: none;
  }
  .cta-card > * { position: relative; }
  .cta-label {
    font-size: 10.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .cta-card h3 {
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.015em;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .cta-card p {
    color: rgba(250,248,243,0.72);
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .cta-buttons {
    display: flex;
    gap: 8px;
  }
  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: #fff;
    padding: 11px 14px;
    border-radius: 30px;
    border: 0;
    font-family: inherit;
    font-weight: 500;
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-primary:hover {
    background: #1e5fd1;
  }
  .btn-secondary {
    background: transparent;
    color: #faf8f3;
    padding: 11px 14px;
    border-radius: 30px;
    border: 1px solid rgba(250,248,243,0.3);
    font-family: inherit;
    font-weight: 500;
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-secondary:hover {
    border-color: rgba(250,248,243,0.7);
  }

  .result-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: var(--ink-muted);
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .result-foot a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--line-strong);
    text-underline-offset: 3px;
  }

  /* Animations between steps */
  .step { animation: stepIn 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes stepIn {
    from { opacity: 0; transform: translateX(8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Mobile */
  @media (max-width: 600px) {
    .modal-inner { padding: 28px 22px 22px; }
    h2.q-title { font-size: 24px; }
    .options-exp { grid-template-columns: 1fr; }
    .options-exp .option { min-height: auto; flex-direction: row; }
    .hero h1 { font-size: 36px; }
    .hero { padding: 60px 24px 50px; }
    .fake-nav { padding: 18px 20px; }
    .fake-nav-links { display: none; }
  }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="browser-chrome">
    <div class="browser-dots"><span></span><span></span><span></span></div>
    <div class="browser-url">buildingsmart.no</div>
  </div>

  <div class="site-frame">
    <div class="fake-nav">
      <div class="fake-logo">buildingSMART<span class="fake-logo-dot"></span> Norge</div>
      <div class="fake-nav-links">
        <span>Om oss</span><span>Standarder</span><span>Fagnettverk</span><span>Hva skjer</span>
      </div>
      <div class="fake-nav-cta">Bli medlem</div>
    </div>

    <div class="hero">
      <h1>Åpne standarder for<br><em>byggets livsløp</em></h1>
      <p>buildingSMART Norge forbedrer digital informasjonsflyt i BAE-næringen gjennom åpne internasjonale standarder.</p>

      <!-- ============ THE CTA TO OPEN MODAL ============ -->
      <button class="onboarding-cta" onclick="openModal()">
        <span class="pulse-dot"></span>
        <span class="onboarding-cta-label">Ny her? <strong>Finn ressursene som er relevante for deg</strong></span>
        <span class="onboarding-cta-badge">
          Start <span class="onboarding-cta-badge-time">· 30 SEK</span>
        </span>
      </button>
    </div>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal-backdrop" id="backdrop" onclick="handleBackdropClick(event)">
  <div class="modal" id="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()" aria-label="Lukk">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2 L12 12 M12 2 L2 12"/></svg>
    </button>
    <div class="modal-inner" id="modal-content">
      <!-- JS -->
    </div>
  </div>
</div>

<script>
  const state = { step: 0, role: null, experience: null, context: null };

  // Icon library — compact line icons
  const icons = {
    byggherre: '<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>',
    radgiver: '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 9h16M9 9v11M9 14l4-2 4 2"/></svg>',
    entreprenor: '<svg viewBox="0 0 24 24"><path d="M12 3v3M6 8a6 6 0 0 1 12 0M4 11h16M5 11v10h14V11M9 21v-5h6v5"/></svg>',
    bim: '<svg viewBox="0 0 24 24"><path d="M12 2L3 7v10l9 5 9-5V7zM3 7l9 5 9-5M12 12v10"/></svg>',
    jurist: '<svg viewBox="0 0 24 24"><path d="M12 3v18M6 7h12M5 12l3-5 3 5M13 12l3-5 3 5M5 12a3 3 0 0 0 6 0M13 12a3 3 0 0 0 6 0"/></svg>',
    fm: '<svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v11h14V10M10 21v-6h4v6"/></svg>',
    ny: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    litt: '<svg viewBox="0 0 24 24"><path d="M3 17l4-4 4 4 4-6 6 6M21 10V3h-7"/></svg>',
    erfaren: '<svg viewBox="0 0 24 24"><path d="M3 12l5 5L21 4"/></svg>',
    krav: '<svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
    kompetanse: '<svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5"/></svg>',
    vurderer: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a3 3 0 1 1 4.5 2.5c-.5.5-1 1-1 2M12 17.5h.01"/></svg>',
    nysgjerrig: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>'
  };

  const roles = [
    { id: 'byggherre', label: 'Byggherre / eier', desc: 'Offentlig eller privat, bestiller bygg og infrastruktur', icon: icons.byggherre },
    { id: 'radgiver', label: 'Rådgiver / arkitekt / ingeniør', desc: 'Prosjekterende fag', icon: icons.radgiver },
    { id: 'entreprenor', label: 'Entreprenør', desc: 'Prosjektleder eller utførende', icon: icons.entreprenor },
    { id: 'bim', label: 'BIM-koordinator / -leder', desc: 'Jobber aktivt med modell og samhandling', icon: icons.bim },
    { id: 'jurist', label: 'Jurist / innkjøper', desc: 'Kontrakter, avtaler, anskaffelser', icon: icons.jurist },
    { id: 'fm', label: 'Forvaltning / drift', desc: 'FDV, eiendomsforvaltning', icon: icons.fm }
  ];

  function render() {
    const el = document.getElementById('modal-content');
    if (state.step === 0) {
      el.innerHTML = renderQuestion({
        num: '01/03',
        eyebrow: 'Finn din vei',
        title: '<em>Hvem</em> er du?',
        subtitle: 'Tre korte spørsmål. Vi peker deg til det som faktisk er relevant.',
        options: roles,
        variant: 'list',
        onSelect: 'selectRole'
      });
    } else if (state.step === 1) {
      el.innerHTML = renderQuestion({
        num: '02/03',
        eyebrow: 'Nesten der',
        title: 'Hvor godt kjenner du <em>åpenBIM</em>?',
        subtitle: 'Ærlig svar gir bedre anbefaling.',
        options: experience,
        variant: 'exp',
        onSelect: 'selectExperience'
      });
    } else if (state.step === 2) {
      const ctxs = contexts[state.role];
      el.innerHTML = renderQuestion({
        num: '03/03',
        eyebrow: 'Siste spørsmål',
        title: 'Hva er <em>mest aktuelt</em> nå?',
        subtitle: 'Det som står øverst på listen din.',
        options: ctxs,
        variant: 'list',
        onSelect: 'selectContext'
      });
    } else if (state.step === 3) {
      el.innerHTML = renderResult();
    }
  }

  function renderQuestion({ num, eyebrow, title, subtitle, options, variant, onSelect }) {
    const bars = [0, 1, 2].map(i => {
      let cls = '';
      if (i < state.step) cls = 'done';
      else if (i === state.step) cls = 'active';
      return `<span class="${cls}"></span>`;
    }).join('');

    const timeLeft = [30, 20, 10][state.step] || 10;

    const optsHtml = options.map(opt => {
      if (variant === 'exp') {
        return `
          <button class="option" onclick="${onSelect}('${opt.id}')">
            <div class="option-icon">${opt.icon}</div>
            <div class="option-text">
              <div class="option-label">${opt.label}</div>
              ${opt.desc ? `<div class="option-desc">${opt.desc}</div>` : ''}
            </div>
          </button>
        `;
      }
      return `
        <button class="option" onclick="${onSelect}('${opt.id}')">
          <div class="option-icon">${opt.icon}</div>
          <div class="option-text">
            <div class="option-label">${opt.label}</div>
            ${opt.desc ? `<div class="option-desc">${opt.desc}</div>` : ''}
          </div>
          <div class="option-arrow">→</div>
        </button>
      `;
    }).join('');

    return `
      <div class="step">
        <div class="modal-head">
          <div class="eyebrow"><span class="eyebrow-dot"></span>${eyebrow}</div>
          <h2 class="q-title">${title}</h2>
          <p class="q-subtitle">${subtitle}</p>
        </div>
        <div class="progress-row">
          <div class="progress-bars">${bars}</div>
          <div class="progress-meta">
            <span>${num}</span>
            <span>·</span>
            <span class="time-remaining">~${timeLeft} sek</span>
          </div>
        </div>
        <div class="options ${variant === 'exp' ? 'options-exp' : ''}">${optsHtml}</div>
        <div class="modal-foot">
          <button class="back-link" onclick="goBack()" ${state.step === 0 ? 'disabled' : ''}>← Tilbake</button>
          <span>Ingen epost. Ingen innlogging.</span>
        </div>
      </div>
    `;
  }

  function renderResult() {
    const key = `${state.role}-${state.context}`;
    const r = results[key];

    const resHtml = r.resources.map((res, i) => `
      <a class="resource" href="#">
        <div class="resource-num">0${i + 1}</div>
        <div class="resource-body">
          <div class="resource-type">${res.type}</div>
          <div class="resource-title">${res.title}</div>
          <div class="resource-meta">${res.meta}</div>
        </div>
        <div class="resource-arrow">→</div>
      </a>
    `).join('');

    return `
      <div class="step result">
        <div class="modal-head">
          <div class="eyebrow"><span class="eyebrow-dot"></span>Din vei inn</div>
          <h2>${r.headline}</h2>
          <p class="result-intro-text">${r.intro}</p>
        </div>
        <div class="resources">${resHtml}</div>
        <div class="cta-card">
          <div class="cta-label">For deg som ikke er medlem</div>
          <h3>${r.ctaHeading}</h3>
          <p>${r.ctaBody}</p>
          <div class="cta-buttons">
            <button class="btn-primary">Bli medlem →</button>
            <button class="btn-secondary">Book prat →</button>
          </div>
        </div>
        <div class="result-foot">
          <button class="back-link" onclick="restart()">↺ Start på nytt</button>
          <span>Få ressursene på <a href="#">e-post</a></span>
        </div>
      </div>
    `;
  }

  function openModal() {
    document.getElementById('backdrop').classList.add('active');
    document.body.style.overflow = 'hidden';
    state.step = 0; state.role = null; state.experience = null; state.context = null;
    render();
  }
  function closeModal() {
    document.getElementById('backdrop').classList.remove('active');
    document.body.style.overflow = '';
  }
  function handleBackdropClick(e) {
    if (e.target.id === 'backdrop') closeModal();
  }
  function selectRole(id) { state.role = id; state.step = 1; render(); }
  function selectExperience(id) { state.experience = id; state.step = 2; render(); }
  function selectContext(id) { state.context = id; state.step = 3; render(); }
  function goBack() { if (state.step > 0) { state.step--; render(); } }
  function restart() { state.step = 0; state.role = null; state.experience = null; state.context = null; render(); }

  // Esc to close
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  render();
</script>
</body>
</html>
